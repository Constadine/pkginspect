weights:
  # Integrity
  missing_checksums:   -30   # sources but no checksum array at all
  skip_checksum_some:  -30   # SKIP on some downloaded files (VCS, .sig and local files may SKIP)
  skip_checksum_all:   -50   # SKIP on every downloaded file
  skip_checksum_docs:  -5    # SKIP on documentation-only files (.html, .txt, LICENSE, ...)
  weak_hash:           -5    # md5 or sha1 are the only algorithms used
  # Transport
  insecure_url:        -10   # per http/ftp source that nothing verifies (SKIP, unpinned VCS)
  git_unpinned:        -10   # unpinned VCS source in a package that is not a -git package
  suspicious_host:     -25   # raw IP, paste/temp-file site, shortener, Discord CDN, tunnel, dynamic DNS
  # Execution (dangerous patterns)
  pipe_to_shell:       -30   # curl|sh, bash <(curl ...), eval "$(curl ...)"
  eval_exec:           -15   # eval, sh -c / bash -c
  obfuscation:         -25   # base64 -d, xxd -r, openssl enc -d, \x escapes, big base64 blobs
  ld_preload:          -20   # LD_PRELOAD=
  reverse_shell:       -50   # /dev/tcp, nc -e, socat exec:, bash -i >&, ...
  persistence:         -30   # cron, authorized_keys, shell rc files, autostart, sudoers
  persistence_service: -10   # systemctl enable (start/stop/restart/disable are fine)
  tmp_usage:           -5    # hardcoded /tmp/ paths (predictable temp files)
  # Privilege / build networking
  network_fetch:       -15   # curl, wget, git clone in build code
  sudo_or_pacman:      -25   # sudo/doas/pkexec/su -c, pacman -S/-U/-R/-D
  privilege_escal:     -10   # writes outside $pkgdir, writes to your home directory
  setuid_bit:          -10   # chmod u+s / g+s / 4755, setcap, chmod 777 (not a Chromium/Electron *-sandbox helper)
  # Metadata absence
  no_license:          -3
  no_arch_field:       -2
  no_maintainer_tag:   -2
  # namcap
  namcap_error:        -5    # per error
  # Community / AUR
  aur_low_votes_1:   -2     # 15-29 votes
  aur_low_votes_2:   -5     # 1-14 votes
  aur_low_votes_3:  -15     # 0 votes
  aur_orphaned:      -8     # no maintainer
  aur_out_of_date:  -10     # flagged OOD for 30+ days
  aur_out_of_date_recent: -2  # flagged OOD less than 30 days ago
  aur_new_package:       -15  # first submitted less than 30 days ago
  aur_very_new_package:  -25  # first submitted less than 7 days ago (replaces the one above)


caps:
  integrity:  -50
  transport:  -30
  execution:  -50
  privilege:  -40
  metadata:   -25
  community:  -40

blockers:
  uses_sudo: true
  writes_outside_pkgdir: true
  reverse_shell: true
